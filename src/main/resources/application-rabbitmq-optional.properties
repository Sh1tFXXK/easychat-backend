# RabbitMQ可选配置文件
# 如果不需要RabbitMQ功能，可以使用此配置文件

# 禁用RabbitMQ配置
# spring.rabbitmq.host=
# spring.rabbitmq.port=
# spring.rabbitmq.username=
# spring.rabbitmq.password=

# 说明：
# 1. 当RabbitMQ不可用时，系统会自动降级到直接处理模式
# 2. 通知功能会通过Socket.IO直接发送，不经过消息队列
# 3. 不影响核心聊天功能的正常使用
# 4. 适用于开发环境或不需要高并发消息处理的场景

# 使用方法：
# java -jar easychat.jar --spring.config.additional-location=classpath:application-rabbitmq-optional.properties